spring:
  application:
    name: ballpark-ticketing
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    web:
      pageable:
        max-page-size: 100

app:
  jwt:
    # 운영에서는 JWT_SECRET 환경변수로 덮어쓴다. 32바이트 이상이어야 한다.
    secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789}
    expiry-minutes: 120

management:
  endpoints:
    web:
      exposure:
        include: health, info

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:mysql://localhost:3306/ballpark?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&rewriteBatchedStatements=true
    username: ballpark
    password: ballpark
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
app:
  live-simulator:
    enabled: true
    # 1.0이 실제 속도(경기 2~7시간). 시연할 때 5나 10으로 올리면 빠르게 돌아간다.
    speed: 1.0
