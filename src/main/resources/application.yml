spring:
  application:
    name: ballpark-ticketing
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # 상태 enum을 MySQL 네이티브 enum이 아니라 varchar로 만든다(ISSUE-03). 상태 값을 추가할 때마다
        # ALTER TABLE이 필요하던 문제를 없앤다.
        type:
          preferred_enum_jdbc_type: VARCHAR
  data:
    web:
      pageable:
        max-page-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health, info

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:mysql://localhost:3306/ballpark?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&rewriteBatchedStatements=true
    username: ballpark
    password: ballpark
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
